<!DOCTYPE html>
<html>
<head>
  <title>Course Enrollment</title>
</head>
<body>
  <h2>Course Enrollment Form</h2>
  <form action="/enroll" method="POST">
    <label>Student ID:</label>
    <input type="text" name="student_id" required><br>

    <label>Name:</label>
    <input type="text" name="name" required><br>

    <label>Course Name:</label>
    <input type="text" name="course_name" required><br>

    <label>Duration (weeks):</label>
    <input type="number" name="duration" required><br>

    <label>Status:</label>
    <input type="text" name="status" value="active" required><br>

    <button type="submit">Enroll</button>
  </form>

  <hr>

  <h2>Mark Enrollment as Completed</h2>
  <form id="updateForm">
    <label>Student ID:</label>
    <input type="text" id="updateStudentId"><br>

    <label>OR Course Name:</label>
    <input type="text" id="updateCourseName"><br>

    <button type="submit">Mark as Completed</button>
  </form>

  <script>
    document.getElementById('updateForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const student_id = document.getElementById('updateStudentId').value.trim();
      const course_name = document.getElementById('updateCourseName').value.trim();

      const data = {};
      if (student_id) data.student_id = student_id;
      else if (course_name) data.course_name = course_name;
      else return alert("Please provide either Student ID or Course Name");

      try {
        const response = await fetch('/complete', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const text = await response.text();
        alert(text);
      } catch (err) {
        alert('Failed to update enrollment');
      }
    });
  </script>
</body>
</html>
