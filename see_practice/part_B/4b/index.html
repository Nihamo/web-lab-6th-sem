<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>insert student detials</h2>
  <form action="/submit" method="post">
    student id: <input type="text" name="id"><br>
    name:<input type="text" name="name"><br>
    company:<input type="text" name="company"><br>
    duration:<input type="text" name="duration"><br>
    status:<input type="text" name="status"><br>
    <button type="submit">submit</button>
  </form>

  <hr>
  <h2>display students interning infosys</h2><br>
  <button onclick="studentIn()">show</button><br>
  <div id="result1"></div>
  <hr>

  <h2>updating status</h2>
  <form id="updateForm">
    student id:<input type="text" id="updateId" ><br>
    <button type="submit">mark as completed</button>
  </form>

  <script>
    document.getElementById("updateForm").addEventListener('submit',async function (e){
      e.preventDefault();

      const id = document.getElementById("updateId").value;

      const res = await fetch("/updateStatus",{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id: id})
      });
      const text = await res.text();
      alert(text);
    });
    
    async function studentIn(){
      const res = await fetch('/infosys');
      const html = await res.text();
      document.getElementById("result1").innerHTML = html;
    };
  </script>
</body>
</html>
